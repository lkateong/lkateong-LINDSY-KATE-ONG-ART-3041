<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chair Sequence Exploration - Interactive Visual Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fffdf0;
            color: #233123;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f4f0d9;
        }
        ::-webkit-scrollbar-thumb {
            background: #a1c0a1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #679267;
        }
        .card-glow:hover {
            box-shadow: 0 10px 25px -5px rgba(103, 146, 103, 0.25), 0 8px 10px -6px rgba(103, 146, 103, 0.15);
        }
        .glass-panel {
            background: rgba(255, 253, 240, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(103, 146, 103, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#679267] selection:text-white">

    <header class="sticky top-0 z-30 glass-panel border-b border-[#679267]/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-[#679267]/15 border border-[#679267]/30 rounded-xl text-[#4A704A]">
                    <i class="fa-solid fa-chair text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-[#233123] tracking-tight">Chair Sequence Lab</h1>
                    <p class="text-xs text-[#526e52]">9-Cell Multi-Stage Prompting Breakdown</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 bg-[#f4f0d9]/80 p-1.5 rounded-xl border border-[#679267]/20 text-xs">
                <span class="px-3 py-1.5 rounded-lg bg-[#679267] text-white font-semibold shadow-sm">Grid View</span>
                <button class="px-3 py-1.5 text-[#355235] hover:text-[#182618] transition-colors cursor-pointer" onclick="openModal(0)">Start Presentation</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Cell Generation via JS -->
        </div>
    </main>

    <footer class="border-t border-[#679267]/20 bg-[#f4f0d9]/50 py-6 text-center text-xs text-[#526e52]">
        <p>Interactive Visual Matrix &bull; Sequence Breakdown &bull; Render Pipeline Visualization</p>
    </footer>

    <div id="lightbox-modal" onclick="handleBackdropClick(event)" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-[#182618]/70 backdrop-blur-md transition-opacity duration-300">
        <div class="relative w-full max-w-5xl bg-[#fffdf0] border border-[#679267]/30 rounded-2xl overflow-hidden shadow-2xl flex flex-col md:flex-row max-h-[90vh]">
            
            <button onclick="closeModal()" class="absolute top-4 right-4 z-20 w-10 h-10 flex items-center justify-center rounded-full bg-[#f4f0d9] text-[#355235] hover:text-[#182618] border border-[#679267]/30 hover:bg-[#e4dec2] transition-all">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="relative w-full md:w-2/3 bg-[#182618] flex items-center justify-center p-4 min-h-[300px] md:min-h-[500px]">
                <img id="modal-image" src="" alt="Cell Detail" class="max-h-[70vh] w-auto max-w-full object-contain rounded-lg shadow-lg" onerror="this.onerror=null; this.src='https://placehold.co/800x800/f4f0d9/679267?text=Image+Not+Found';">
                
                <button id="prev-btn" onclick="prevSlide()" class="absolute left-4 top-1/2 -translate-y-1/2 w-11 h-11 flex items-center justify-center rounded-full bg-[#233123]/80 text-[#d9e6d9] border border-[#679267]/50 hover:bg-[#679267] hover:text-white hover:border-[#679267] transition-all">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button id="next-btn" onclick="nextSlide()" class="absolute right-4 top-1/2 -translate-y-1/2 w-11 h-11 flex items-center justify-center rounded-full bg-[#233123]/80 text-[#d9e6d9] border border-[#679267]/50 hover:bg-[#679267] hover:text-white hover:border-[#679267] transition-all">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <div class="w-full md:w-1/3 p-6 sm:p-8 flex flex-col justify-between border-t md:border-t-0 md:border-l border-[#679267]/20 bg-[#fffdf0] overflow-y-auto">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-2">
                            <span id="modal-badge" class="px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-[#679267]/15 text-[#355235] border border-[#679267]/30">
                                Cell 01
                            </span>
                            <span id="modal-counter" class="text-xs text-[#526e52] font-mono">1 / 9</span>
                        </div>
                        <span id="modal-model" class="px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-[#f4f0d9] text-[#233123] border border-[#679267]/20">
                            Gemini
                        </span>
                    </div>

                    <h2 id="modal-title" class="text-xl font-bold text-[#233123] mb-4 leading-snug">
                        Title
                    </h2>

                    <div class="space-y-3">
                        <label class="text-xs uppercase font-semibold text-[#526e52] tracking-wider">Prompt / Specification</label>
                        <p id="modal-description" class="text-sm text-[#233123] leading-relaxed bg-[#f4f0d9]/60 p-4 rounded-xl border border-[#679267]/20 font-mono">
                            Description text...
                        </p>
                    </div>
                </div>

                <div class="pt-6 mt-6 border-t border-[#679267]/20 flex items-center justify-between text-xs text-[#526e52]">
                    <span>Use <kbd class="px-1.5 py-0.5 bg-[#f4f0d9] rounded border border-[#679267]/30 text-[#233123]">←</kbd> <kbd class="px-1.5 py-0.5 bg-[#f4f0d9] rounded border border-[#679267]/30 text-[#233123]">→</kbd> to navigate</span>
                    <span><kbd class="px-1.5 py-0.5 bg-[#f4f0d9] rounded border border-[#679267]/30 text-[#233123]">ESC</kbd> to close</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cellSequence = [
            {
                id: "01",
                title: "The Bare Prompt",
                generator: "Gemini",
                prompt: "I'm going to give you a series of image prompts. starting simple and building up. don't add anything. here is my first prompt: a chair in the middle of a room.",
                image: "Gemini_Generated_Image_j5u1mfj5u1mfj5u1.jpg"
            },
            {
                id: "02",
                title: "Adjectives & Material",
                generator: "Gemini",
                prompt: "a popcorn chair in the middle of a theater room",
                image: "Gemini_Generated_Image_whm48uwhm48uwhm4.jpg"
            },
            {
                id: "03",
                title: "The Setting & Mood",
                generator: "Gemini",
                prompt: "a popcorn chair front facing in the middle of a theater room when its nighttime there are no other objects and giving vintage vibes that looks more like a chair and the walls are clean and 90's like and gives the vibe of an old movie theater",
                image: "Gemini_Generated_Image_1a8xzc1a8xzc1a8x (1).jpg"
            },
            {
                id: "04",
                title: "Refining Form & Details",
                generator: "Gemini",
                prompt: "a popcorn chair front facing in the middle of a theater room when its nighttime there are no other objects and giving vintage vibes that looks more like a chair and the walls are clean and 90's like and gives the vibe of an old movie theater",
                image: "Gemini_Generated_Image_z6ushyz6ushyz6us.jpg"
            },
            {
                id: "05",
                title: "The Camera & Optics",
                generator: "Gemini",
                prompt: "shot from the right corner of the room with a zoom on the side of the chair 16:9 format f stop 1.2",
                image: "Gemini_Generated_Image_wv32i4wv32i4wv32.jpg"
            },
            {
                id: "06",
                title: "The Reference, Marked Up",
                generator: "Gemini",
                prompt: "make the view/angle top angle like the image I provided",
                image: "4e8b442b-9005-42d9-a01e-ec911af9c58f.jpg"
            },
            {
                id: "07",
                title: "What Came Back",
                generator: "Gemini",
                prompt: "Top-down spatial re-projection into warm theater lounge floor context.",
                image: "Gemini_Generated_Image_fvl4nafvl4nafvl4.jpg"
            },
            {
                id: "08",
                title: "The Same Prompt, A Different Generator",
                generator: "base44",
                prompt: "Full 90° bird's-eye prompt translation tailored for multi-model synthesis.",
                image: "0dc16ffc5_generated_image.webp"
            },
            {
                id: "09",
                title: "Another Pass & Refinement",
                generator: "Gemini",
                prompt: "Direct orthographic bird's-eye alignment over patterned vintage theater carpet.",
                image: "Gemini_Generated_Image_ij9cwuij9cwuij9c.jpg"
            }
        ];

        let currentIndex = 0;

        function renderGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = cellSequence.map((cell, index) => `
                <article onclick="openModal(${index})" class="card-glow group bg-[#faf7e8] border border-[#679267]/30 hover:border-[#679267] rounded-2xl overflow-hidden transition-all duration-300 cursor-pointer flex flex-col justify-between shadow-sm hover:shadow-md">
                    <div>
                        <div class="relative aspect-[16/10] sm:aspect-square bg-[#ece6ca] overflow-hidden border-b border-[#679267]/20">
                            <img src="${cell.image}" alt="${cell.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.onerror=null; this.src='https://placehold.co/800x800/f4f0d9/679267?text=Cell+${cell.id}';">
                            <div class="absolute inset-0 bg-gradient-to-t from-[#182618]/70 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end justify-between p-4">
                                <span class="text-xs font-semibold text-[#d9e6d9] bg-[#182618]/80 px-3 py-1 rounded-full border border-[#679267]/40">
                                    <i class="fa-solid fa-magnifying-glass-plus mr-1"></i> Inspect
                                </span>
                            </div>
                            <span class="absolute top-3 left-3 bg-[#fffdf0]/90 border border-[#679267]/30 text-[#355235] font-mono text-xs px-2.5 py-1 rounded-md font-bold backdrop-blur-md shadow-sm">
                                Cell ${cell.id}
                            </span>
                            <span class="absolute top-3 right-3 ${cell.generator === 'base44' ? 'bg-[#679267] text-white font-bold' : 'bg-[#fffdf0]/90 text-[#355235] border border-[#679267]/30'} font-mono text-[10px] px-2 py-0.5 rounded backdrop-blur-md shadow-sm">
                                ${cell.generator}
                            </span>
                        </div>

                        <div class="p-5">
                            <div class="flex items-center justify-between mb-2">
                                <h2 class="text-lg font-bold text-[#233123] group-hover:text-[#4A704A] transition-colors">
                                    ${cell.title}
                                </h2>
                            </div>
                            <p class="text-xs text-[#355235] line-clamp-3 leading-relaxed font-mono bg-[#f4f0d9]/60 p-3 rounded-lg border border-[#679267]/20">
                                "${cell.prompt}"
                            </p>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function openModal(index) {
            currentIndex = index;
            updateModalContent();
            document.getElementById('lightbox-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('lightbox-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function handleBackdropClick(e) {
            if (e.target.id === 'lightbox-modal') {
                closeModal();
            }
        }

        function updateModalContent() {
            const cell = cellSequence[currentIndex];
            document.getElementById('modal-image').src = cell.image;
            document.getElementById('modal-badge').innerText = `Cell ${cell.id}`;
            document.getElementById('modal-model').innerText = cell.generator;
            const counterEl = document.getElementById('modal-counter');
            if (counterEl) {
                counterEl.innerText = `${currentIndex + 1} / ${cellSequence.length}`;
            }
            document.getElementById('modal-title').innerText = cell.title;
            document.getElementById('modal-description').innerText = `"${cell.prompt}"`;
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + cellSequence.length) % cellSequence.length;
            updateModalContent();
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % cellSequence.length;
            updateModalContent();
        }

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('lightbox-modal');
            if (!modal.classList.contains('hidden')) {
                if (e.key === 'Escape') closeModal();
                if (e.key === 'ArrowLeft') prevSlide();
                if (e.key === 'ArrowRight') nextSlide();
            }
        });

        document.addEventListener('DOMContentLoaded', renderGrid);
    </script>
</body>
</html>
