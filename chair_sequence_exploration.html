<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chair Sequence Exploration - Interactive Visual Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFFDF0;
            color: #263326;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F3EAC2;
        }
        ::-webkit-scrollbar-thumb {
            background: #679267;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4F734F;
        }
        .card-glow:hover {
            box-shadow: 0 10px 25px -5px rgba(103, 146, 103, 0.25), 0 8px 10px -6px rgba(103, 146, 103, 0.15);
        }
        .glass-panel {
            background: rgba(255, 253, 240, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(103, 146, 103, 0.2);
        }
        .bg-sage-600 {
            background-color: #679267;
        }
        .bg-sage-700 {
            background-color: #4F734F;
        }
        .bg-sage-50 {
            background-color: #F2F6F2;
        }
        .bg-sage-100 {
            background-color: #E2EBE2;
        }
        .text-sage-800 {
            color: #233823;
        }
        .text-sage-700 {
            color: #355235;
        }
        .text-sage-600 {
            color: #679267;
        }
        .border-sage-200 {
            border-color: #C3D5C3;
        }
        .border-sage-300 {
            border-color: #A6C2A6;
        }
        .border-sage-500 {
            border-color: #679267;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#679267] selection:text-white">

    <header class="sticky top-0 z-30 glass-panel border-b border-sage-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-sage-100 border border-sage-300 rounded-xl text-sage-700">
                    <i class="fa-solid fa-chair text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-sage-800 tracking-tight">Chair Sequence Lab</h1>
                    <p class="text-xs text-sage-700 font-medium">9-Cell Multi-Stage Prompting Breakdown</p>
                </div>
            </div>

            <div class="flex items-center gap-2 bg-white/80 p-1.5 rounded-xl border border-sage-200 text-xs shadow-sm">
                <span class="px-3 py-1.5 rounded-lg bg-sage-600 text-white font-semibold shadow-sm">Grid View</span>
                <button class="px-3 py-1.5 text-sage-700 hover:text-sage-800 transition-colors cursor-pointer font-medium" onclick="openModal(0)">Start Presentation</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Cell Generation via JS -->
        </div>
    </main>

    <footer class="border-t border-sage-200/80 bg-[#FBF5DF] py-6 text-center text-xs text-sage-700">
        <p>Interactive Visual Matrix &bull; Sequence Breakdown &bull; Render Pipeline Visualization</p>
    </footer>

    <div id="lightbox-modal" onclick="handleBackdropClick(event)" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-sage-800/60 backdrop-blur-md transition-opacity duration-200">
        <div class="relative w-full max-w-5xl bg-[#FFFDF0] border border-sage-300 rounded-2xl overflow-hidden shadow-2xl flex flex-col md:flex-row max-h-[90vh]">

            <button onclick="closeModal()" class="absolute top-4 right-4 z-20 w-10 h-10 flex items-center justify-center rounded-full bg-sage-100 text-sage-700 hover:text-sage-800 border border-sage-200 shadow-md">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="relative w-full md:w-2/3 bg-sage-800 flex items-center justify-center p-4 min-h-[300px] md:min-h-[500px]">
                <img id="modal-image" src="" alt="Cell Detail" class="max-h-[70vh] w-auto max-w-full object-contain rounded-lg shadow-lg" onerror="this.onerror=null; this.src='https://placehold.co/1200x800/efefef/333333?text=Image+Not+Found';">

                <button id="prev-btn" onclick="prevSlide()" class="absolute left-4 top-1/2 -translate-y-1/2 w-11 h-11 flex items-center justify-center rounded-full bg-sage-800/90 text-white border border-sage-300 shadow-lg hover:bg-sage-700 transition-colors">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button id="next-btn" onclick="nextSlide()" class="absolute right-4 top-1/2 -translate-y-1/2 w-11 h-11 flex items-center justify-center rounded-full bg-sage-800/90 text-white border border-sage-300 shadow-lg hover:bg-sage-700 transition-colors">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <div class="w-full md:w-1/3 p-6 sm:p-8 flex flex-col justify-between border-t md:border-t-0 md:border-l border-sage-200 bg-[#FFFDF0] overflow-y-auto">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-2">
                            <span id="modal-badge" class="px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-sage-100 text-sage-700 border border-sage-300">
                                Cell 01
                            </span>
                            <span id="modal-counter" class="text-xs text-sage-700 font-mono">1 / 9</span>
                        </div>
                        <span id="modal-model" class="px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-sage-50 text-sage-700 border border-sage-200">
                            Gemini
                        </span>
                    </div>

                    <h2 id="modal-title" class="text-xl font-bold text-sage-800 mb-4 leading-snug">
                        Title
                    </h2>

                    <div class="space-y-3">
                        <label class="text-xs uppercase font-semibold text-sage-700 tracking-wider">Prompt / Specification</label>
                        <p id="modal-description" class="text-sm text-sage-800 leading-relaxed bg-sage-50 p-4 rounded-xl border border-sage-200 font-mono">
                            Description text...
                        </p>
                    </div>
                </div>

                <div class="pt-6 mt-6 border-t border-sage-200 flex items-center justify-between text-xs text-sage-700">
                    <span>Use <kbd class="px-1.5 py-0.5 bg-sage-100 rounded border border-sage-300 text-sage-800">←</kbd> <kbd class="px-1.5 py-0.5 bg-sage-100 rounded border border-sage-300 text-sage-800">→</kbd></span>
                    <span><kbd class="px-1.5 py-0.5 bg-sage-100 rounded border border-sage-300 text-sage-800">ESC</kbd> to close</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cellSequence = [
            {
                id: "01",
                title: "The Bare Prompt",
                generator: "Gemini",
                prompt: "I'm going to give you a series of image prompts. starting simple and building up. don't add anything. here is my first prompt: a chair in the middle of a room.",
                image: "cell01.jpg"
            },
            {
                id: "02",
                title: "Adjectives & Material",
                generator: "Gemini",
                prompt: "a popcorn chair in the middle of a theater room",
                image: "cell02.jpg"
            },
            {
                id: "03",
                title: "The Setting & Mood",
                generator: "Gemini",
                prompt: "a popcorn chair front facing in the middle of a theater room when its nighttime there are no other objects and giving vintage vibes that looks more like a chair and the whole room should feel cinematic but still minimal.",
                image: "cell03.jpg"
            },
            {
                id: "04",
                title: "Refining Form & Details",
                generator: "Gemini",
                prompt: "a popcorn chair front facing in the middle of a theater room when its nighttime there are no other objects and giving vintage vibes that looks more like a chair and the whole room should feel cinematic but still minimal.",
                image: "cell04.jpg"
            },
            {
                id: "05",
                title: "The Camera & Optics",
                generator: "Gemini",
                prompt: "shot from the right corner of the room with a zoom on the side of the chair 16:9 format f stop 1.2",
                image: "cell05.jpg"
            },
            {
                id: "06",
                title: "The Reference, Marked Up",
                generator: "Gemini",
                prompt: "make the view/angle top angle like the image I provided",
                image: "cell06.jpg"
            },
            {
                id: "07",
                title: "What Came Back",
                generator: "Gemini",
                prompt: "Top-down spatial re-projection into warm theater lounge floor context.",
                image: "cell07.jpg"
            },
            {
                id: "08",
                title: "The Same Prompt, A Different Generator",
                generator: "base44",
                prompt: "Full 90° bird's-eye prompt translation tailored for multi-model synthesis.",
                image: "cell08.jpg"
            },
            {
                id: "09",
                title: "Another Pass & Refinement",
                generator: "Gemini",
                prompt: "Direct orthographic bird's-eye alignment over patterned vintage theater carpet.",
                image: "cell09.jpg"
            }
        ];

        let currentIndex = 0;

        function renderGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = cellSequence.map((cell, index) => `
                <article onclick="openModal(${index})" class="card-glow group bg-[#FBF5DF] border border-sage-200 hover:border-sage-500 rounded-2xl overflow-hidden transition-all duration-300 cursor-pointer">
                    <div>
                        <div class="relative aspect-[16/10] sm:aspect-square bg-sage-100 overflow-hidden border-b border-sage-200">
                            <img src="${cell.image}" alt="${cell.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.onerror=null; this.src='https://placehold.co/1200x800/efefef/333333?text=Image+Not+Found';">
                            <div class="absolute inset-0 bg-gradient-to-t from-sage-800/70 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end justify-start p-4">
                                <span class="text-xs font-semibold text-white bg-sage-800/80 px-3 py-1 rounded-full border border-sage-300/40">
                                    <i class="fa-solid fa-magnifying-glass-plus mr-1"></i> Inspect
                                </span>
                            </div>
                            <span class="absolute top-3 left-3 bg-white/90 border border-sage-200 text-sage-800 font-mono text-xs px-2.5 py-1 rounded-md font-bold backdrop-blur-md shadow-sm">
                                Cell ${cell.id}
                            </span>
                            <span class="absolute top-3 right-3 ${cell.generator === 'base44' ? 'bg-sage-600 text-white font-bold' : 'bg-white/90 text-sage-800 border border-sage-200'} font-mono text-xs px-2.5 py-1 rounded-md border backdrop-blur-md shadow-sm">
                                ${cell.generator}
                            </span>
                        </div>

                        <div class="p-5">
                            <div class="flex items-center justify-between mb-2">
                                <h2 class="text-lg font-bold text-sage-800 group-hover:text-sage-600 transition-colors">
                                    ${cell.title}
                                </h2>
                            </div>
                            <p class="text-xs text-sage-700 line-clamp-3 leading-relaxed font-mono bg-white/80 p-3 rounded-lg border border-sage-200/80">
                                "${cell.prompt}"
                            </p>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function openModal(index) {
            currentIndex = index;
            updateModalContent();
            document.getElementById('lightbox-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('lightbox-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function handleBackdropClick(e) {
            if (e.target.id === 'lightbox-modal') {
                closeModal();
            }
        }

        function updateModalContent() {
            const cell = cellSequence[currentIndex];
            document.getElementById('modal-image').src = cell.image;
            document.getElementById('modal-badge').innerText = `Cell ${cell.id}`;
            document.getElementById('modal-model').innerText = cell.generator;
            const counterEl = document.getElementById('modal-counter');
            if (counterEl) {
                counterEl.innerText = `${currentIndex + 1} / ${cellSequence.length}`;
            }
            document.getElementById('modal-title').innerText = cell.title;
            document.getElementById('modal-description').innerText = `"${cell.prompt}"`;
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + cellSequence.length) % cellSequence.length;
            updateModalContent();
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % cellSequence.length;
            updateModalContent();
        }

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('lightbox-modal');
            if (!modal.classList.contains('hidden')) {
                if (e.key === 'Escape') closeModal();
                if (e.key === 'ArrowLeft') prevSlide();
                if (e.key === 'ArrowRight') nextSlide();
            }
        });

        document.addEventListener('DOMContentLoaded', renderGrid);
    </script>
</body>
</html>
